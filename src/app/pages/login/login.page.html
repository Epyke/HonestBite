<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-content">
  <main class="login-page">
    <ion-card class="login-card">
      <section class="brand">
        <h1>HonestBite</h1>
        <p>Entra na tua conta para descobrir avaliações honestas de restaurantes.</p>
      </section>

      <form [formGroup]="loginForm" (ngSubmit)="fazerLogin()" class="login-form">
        <ion-list lines="none" class="form-list">
          <div class="field">
            <ion-item
              class="premium-input"
              [class.field-invalid]="email?.invalid && email?.touched"
            >
              <ion-input
                label="E-mail"
                label-placement="floating"
                type="email"
                inputmode="email"
                autocomplete="email"
                formControlName="email"
                [errorText]="emailError"
              ></ion-input>
            </ion-item>
          </div>

          <div class="field">
            <ion-item
              class="premium-input"
              [class.field-invalid]="password?.invalid && password?.touched"
            >
              <ion-input
                label="Palavra-passe"
                label-placement="floating"
                [type]="mostrarPassword ? 'text' : 'password'"
                autocomplete="current-password"
                formControlName="password"
                errorText="Este campo é obrigatório"
              ></ion-input>

              <ion-button
                slot="end"
                fill="clear"
                type="button"
                class="password-toggle"
                (click)="alternarPassword()"
                [attr.aria-label]="mostrarPassword ? 'Esconder password' : 'Mostrar password'"
              >
                <ion-icon [name]="mostrarPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
              </ion-button>
            </ion-item>
          </div>
        </ion-list>

        @if (errorMessage) {
          <ion-note color="danger">{{ errorMessage }}</ion-note>
        }

        <ion-button
          expand="block"
          type="submit"
          class="login-button"
          [disabled]="loginForm.invalid || loading"
        >
          @if (loading) {
            <ion-spinner name="dots"></ion-spinner>
          } @else {
            Entrar
          }
        </ion-button>
      </form>

      <footer class="login-links">
        <span>Ainda não tens conta? <a routerLink="/register">Regista-te aqui</a></span>
      </footer>
    </ion-card>
  </main>
</ion-content>
